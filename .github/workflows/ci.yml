name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v5 chay tren Node 24 cua runner. Ban v4 target Node 20 va da bi GitHub bao
      # deprecated — moi lan chay CI deu hien mot canh bao.
      - uses: actions/setup-node@v5
        with:
          # Next 16 yeu cau >= 20.9. Chon 22 (LTS) thay vi 20: may phat trien dang
          # chay Node 24, de CI o muc san toi thieu thi no khong con kiem chung dung
          # cai ma nguoi ta thuc su chay.
          node-version: 22
          cache: npm

      # `npm ci` chạy postinstall -> `prisma generate`, cần schema nhưng KHÔNG cần kết nối DB.
      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra kiểu (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `build` (khác `vercel-build`) chỉ generate + next build, KHÔNG chạm DB thật.
      - name: Build
        run: npm run build
        env:
          # Giá trị giả: chỉ để Prisma parse được URL lúc build; không có kết nối nào được mở.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-khong-dung-cho-moi-truong-that-0123456789
